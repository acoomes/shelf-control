# Publishes two builds of the game to GitHub Pages from one repository:
#   main  ->  https://<owner>.github.io/<repo>/        the shipped ("live") build: developer tools off
#   dev   ->  https://<owner>.github.io/<repo>/test/   the test build: debug overlay, seed field, "test build" label
# Each build is assembled by tools/assemble.sh from its own branch (index.html with its channel set, the installable-app
# files with the commit stamped into the worker's cache version, the test build renamed), so a packaging change on dev
# reaches /test/ without a ship. Setting: Settings -> Pages -> Source: "GitHub Actions".
# The github-pages environment accepts deployments from main only, so a push to dev does not deploy by itself: its `relay`
# job asks the main-branch copy of this workflow to run, and that run publishes both builds (it checks dev out by name).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write        # relay: dispatch this workflow on main
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  relay:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Ask the main-branch workflow to publish both builds
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (live build)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - name: Does a dev branch exist yet?
        id: dev
        # only a missing branch selects the fallback below; any other ls-remote failure (auth, network) stops the deploy
        run: |
          rc=0; git -C live ls-remote --exit-code --heads origin refs/heads/dev >/dev/null || rc=$?
          case $rc in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT"; echo "no dev branch yet: /test/ will mirror main" ;;
            *) echo "git ls-remote failed with exit code $rc"; exit "$rc" ;;
          esac
      - name: Check out dev (test build)
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: test
      - name: Assemble the site
        # each build by its own branch's script, so what dev ships to /test/ is what dev's tests checked
        run: |
          set -eu
          src=$([ "${{ steps.dev.outputs.exists }}" = "true" ] && echo test || echo live)
          bash live/tools/assemble.sh live site live
          bash "$src/tools/assemble.sh" "$src" site/test test
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
