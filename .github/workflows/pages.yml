# Publishes two builds of the game to GitHub Pages from one repository:
#   main  ->  https://<owner>.github.io/<repo>/        the shipped ("live") build: developer tools off
#   dev   ->  https://<owner>.github.io/<repo>/test/   the test build: debug overlay, seed field, "test build" label
# Shipping is a merge from dev into main. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (live build)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - name: Check out dev (test build)
        id: dev
        uses: actions/checkout@v4
        continue-on-error: true      # until the dev branch exists, /test/ mirrors main
        with:
          ref: dev
          path: test
      - name: Assemble the site
        run: |
          set -eu
          mkdir -p site/test
          cp live/index.html site/index.html
          # the only difference between the builds: this one line flips the channel, and the deploy fails if it is not found
          sed -i "s/^const BUILD = { channel: 'dev' };$/const BUILD = { channel: 'live' };/" site/index.html
          grep -q "^const BUILD = { channel: 'live' };$" site/index.html
          if [ -f test/index.html ]; then cp test/index.html site/test/index.html; else cp live/index.html site/test/index.html; fi
          touch site/.nojekyll
          echo "live: $(git -C live rev-parse --short HEAD)  test: $([ -d test/.git ] && git -C test rev-parse --short HEAD || echo 'main (no dev branch yet)')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
