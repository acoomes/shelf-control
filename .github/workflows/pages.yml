# Publishes two builds of the game to GitHub Pages from one repository:
#   main  ->  https://<owner>.github.io/<repo>/        the shipped ("live") build: developer tools off
#   dev   ->  https://<owner>.github.io/<repo>/test/   the test build: debug overlay, seed field, "test build" label
# Each build is index.html plus its installable-app files (manifest, service worker, icons); the deploy stamps the commit
# into the worker's cache version and renames the test build's app. Setting: Settings -> Pages -> Source: "GitHub Actions".
# The github-pages environment accepts deployments from main only, so a push to dev does not deploy by itself: its `relay`
# job asks the main-branch copy of this workflow to run, and that run publishes both builds (it checks dev out by name).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write        # relay: dispatch this workflow on main
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  relay:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Ask the main-branch workflow to publish both builds
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (live build)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - name: Does a dev branch exist yet?
        id: dev
        # only a missing branch selects the fallback below; any other ls-remote failure (auth, network) stops the deploy
        run: |
          rc=0; git -C live ls-remote --exit-code --heads origin refs/heads/dev >/dev/null || rc=$?
          case $rc in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT"; echo "no dev branch yet: /test/ will mirror main" ;;
            *) echo "git ls-remote failed with exit code $rc"; exit "$rc" ;;
          esac
      - name: Check out dev (test build)
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: test
      - name: Assemble the site
        run: |
          set -eu
          mkdir -p site/test
          cp live/index.html site/index.html
          # the only difference between the builds: this one line flips the channel, and the deploy fails if it is not found
          sed -i "s/^const BUILD = { channel: 'dev' };$/const BUILD = { channel: 'live' };/" site/index.html
          grep -q "^const BUILD = { channel: 'live' };$" site/index.html
          src=$([ "${{ steps.dev.outputs.exists }}" = "true" ] && echo test || echo live)
          cp "$src/index.html" site/test/index.html
          # the installable app: manifest, worker, icons; the worker's cache version is the deployed commit
          for pair in "live site" "$src site/test"; do set -- $pair
            cp "$1/manifest.webmanifest" "$1/sw.js" "$2/"; cp -r "$1/icons" "$2/icons"
            sed -i "s/^const VERSION = 'dev';$/const VERSION = '$(git -C "$1" rev-parse --short HEAD)';/" "$2/sw.js"
            grep -q "^const VERSION = '[0-9a-f]\{7,\}';$" "$2/sw.js"
          done
          sed -i 's/"name": "Shelf Control"/"name": "Shelf Control (test)"/; s/"short_name": "Shelf Control"/"short_name": "SC test"/' site/test/manifest.webmanifest
          grep -q '"name": "Shelf Control (test)"' site/test/manifest.webmanifest
          # iOS labels a home-screen app by this meta, not the manifest, so the test build gets its short name here too
          sed -i 's/^<meta name="apple-mobile-web-app-title" content="Shelf Control">$/<meta name="apple-mobile-web-app-title" content="SC test">/' site/test/index.html
          grep -q '^<meta name="apple-mobile-web-app-title" content="SC test">$' site/test/index.html
          touch site/.nojekyll
          echo "live: $(git -C live rev-parse --short HEAD)  test: $([ "${{ steps.dev.outputs.exists }}" = "true" ] && git -C test rev-parse --short HEAD || echo 'main (no dev branch yet)')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
