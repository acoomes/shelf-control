<canvas id="c"></canvas>
<div id="stage">

<script id="core">
'use strict';
/* =====================================================================
   SHELF CONTROL — core (pure logic)
   Sections: CONFIG → RNG → LEVEL DATA → GENERATOR → SIM
   This <script> has no DOM, no time, no Math.random. It is loaded as-is
   by the Node test harness (tools/headless.mjs), so keep it pure.
   ===================================================================== */

// ============================== CONFIG ==============================
const CONFIG = {
  mode: 'build',           // 'build' | 'yoink' (Phase 5)
  trayCapacity: 5,  shelfCapacity: 5,
  walkSpeed: 4.5,          // columns per second; try 4–6
  minDispatchGap: 0.28,    // seconds; also the tap buffer cadence
  tapBuffer: 2,
  graceSeconds: 2.5,
  stuckBeat: 0.8,
  comboWindow: 1.2,        // seconds; landing-melody ladder
  burstDrop: false,        // experimental; breaks difficulty, see plan §4.3
  assist: true, symbols: false, sound: true,
  dprCap: 2, fixedStep: 1 / 120,
};

// =============================== RNG ================================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/** Small helper API over a mulberry32 stream (mirrors the Python `random` calls the generator uses). */
function makeRng(seed) {
  const next = mulberry32(seed >>> 0);
  const rng = {
    seed: seed >>> 0,
    random: next,
    uniform(a, b) { return a + (b - a) * next(); },
    int(n) { return Math.floor(next() * n); },            // 0 .. n-1
    choice(arr) { return arr[Math.floor(next() * arr.length)]; },
    weightedIndex(weights) {
      let total = 0; for (const w of weights) total += w;
      let r = next() * total;
      for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
      return weights.length - 1;
    },
  };
  return rng;
}

/** FNV-1a string hash → 32-bit seed, so "heart" always seeds the same stream. */
function hashSeed(str) {
  let h = 0x811C9DC5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}

// ============================ LEVEL DATA ============================
const PALETTE = {
  R:{ name:'Strawberry', hex:'#FF5A6E' }, O:{ name:'Tangerine', hex:'#FF9F45' },
  Y:{ name:'Lemon',      hex:'#FFD84D' }, G:{ name:'Mint',      hex:'#5FD38D' },
  B:{ name:'Sky',        hex:'#6EC6FF' }, P:{ name:'Grape',     hex:'#9B7BFF' },
  K:{ name:'Cocoa',      hex:'#6B566F' }, W:{ name:'Cream',     hex:'#FFF4E0' },
  N:{ name:'Bubblegum',  hex:'#FF9CCB' }, T:{ name:'Caramel',   hex:'#C98B5B' },
};
/** Glyph per colour for the colour-blind "symbols" setting (plan §8.4). */
const SYMBOLS = { R:'●', O:'▲', Y:'■', G:'◆', B:'★', P:'♥', K:'✚', W:'☾', N:'⬟', T:'✿' };

const LEVELS = [
  { id:'heart', name:'Heart', art:[           // 9x8, 72 blocks, 3 colours — tutorial
      "WWWWWWWWW",
      "WWNRWRRWW",
      "WNRRRRRRW",
      "WRRRRRRRW",
      "WWRRRRRWW",
      "WWWRRRWWW",
      "WWWWRWWWW",
      "WWWWWWWWW" ],
    lanes:[ "W18 W6 R5 N2", "R5 R3 W7 R12 W14" ] },

  { id:'chick', name:'Chick', art:[           // 10x10, 100 blocks, 5 colours — easy
      "BBBBBBBBBB",
      "BBBYYYYBBB",
      "BBYYYYYYBB",
      "BBYKYYKYBB",
      "BBYYOOYYBB",
      "BYYYYYYYYB",
      "BYYYYYYYYB",
      "BBYYYYYYBB",
      "BBBOBBOBBB",
      "GGGGGGGGGG" ],
    lanes:[ "G10 Y14 B4 K2 B1", "B8 O2 B2 B4 B6", "O2 Y4 Y13 Y9 B19" ] },

  { id:'mushroom', name:'Mushroom', art:[     // 11x10, 110 blocks, 5 colours — easy+
      "BBBBBBBBBBB",
      "BBBRRRRRBBB",
      "BBRRWRRRRBB",
      "BRRRRRRWRRB",
      "BRWRRRRRRRB",
      "BRRRRWRRRRB",
      "BBBWWWWWBBB",
      "BBBWKWKWBBB",
      "BBBWWWWWBBB",
      "GGGGGGGGGGG" ],
    lanes:[ "G11 W1 B5", "W11 B14 B2 R9 B10 W1", "B14 R16 K2 R10 W4" ] },

  { id:'icecream', name:'Ice cream', art:[    // 10x11, 110 blocks, 6 colours — medium
      "BBBBBBBBBB",
      "BBBBRBBBBB",
      "BBBNNNNBBB",
      "BBNNNNNNBB",
      "BBNNNNNNBB",
      "BBGGGGGGBB",
      "BGGGGGGGGB",
      "BBTOTOTOBB",
      "BBBOTOTBBB",
      "BBBBTOBBBB",
      "BBBBOBBBBB" ],
    lanes:[ "B10 T6 B4 N16", "O2 O5 B2 B2 B10", "B9 B18 G8 G6 R1 B8 B3" ] },

  { id:'catface', name:'Cat', art:[           // 11x11, 121 blocks, 5 colours — medium+
      "BBBBBBBBBBB",
      "BOOBBBBBOOB",
      "BONOBBBONOB",
      "BOOOOOOOOOB",
      "BOOOOOOOOOB",
      "BOKOOOOOKOB",
      "BOOOONOOOOB",
      "BOWWOKOWWOB",
      "BBOWWWWWOBB",
      "BBBOOOOOBBB",
      "BBBBBBBBBBB" ],
    lanes:[ "B11 B14 B6 O9 B12 O4 B1", "W9 N1 O9 O7 O8", "O15 K3 B10 N2" ] },

  { id:'rainbow', name:'Rainbow', art:[       // 12x10, 120 blocks, 7 colours — hard (needs lookahead)
      "BBBBBBBBBBBB",
      "BBBBBRRBBBBB",
      "BBBRRRRRRBBB",
      "BRROOOOOORRB",
      "BROOYYYYOORB",
      "RROYGGGGYORR",
      "ROYGPPPPGYOR",
      "ROYGPBBPGYOR",
      "WWWWPBBPWWWW",
      "WWWWWBBWWWWW" ],
    lanes:[ "O8 G2 B15 O8", "G2 P8 Y8 B2 R2", "B7 R16 G4", "W18 B2 Y2 R4 B12" ] },
];

/** Appendix B figures, used by the headless self-test and the level-select tiles. */
const BACKTEST = {
  heart:{ randomWin:0.97, greedyWins:true }, chick:{ randomWin:0.70, greedyWins:true },
  mushroom:{ randomWin:0.52, greedyWins:true }, icecream:{ randomWin:0.32, greedyWins:true },
  catface:{ randomWin:0.13, greedyWins:true }, rainbow:{ randomWin:0.025, greedyWins:false },
};

class LevelError extends Error {}

/** Rows are top→bottom strings; returns colour lists bottom→top per column ('.' = air, only allowed on top). */
function columns(grid) {
  if (!Array.isArray(grid) || grid.length === 0) throw new LevelError('art is empty');
  const H = grid.length, W = grid[0].length;
  for (let r = 0; r < H; r++) if (grid[r].length !== W) throw new LevelError(`row ${r} has length ${grid[r].length}, expected ${W}`);
  const cols = [];
  for (let c = 0; c < W; c++) {
    const seq = [];
    for (let r = H - 1; r >= 0; r--) seq.push(grid[r][c]);
    while (seq.length && seq[seq.length - 1] === '.') seq.pop();
    if (seq.includes('.')) throw new LevelError(`column ${c}: gap under a colour`);
    for (const ch of seq) if (!PALETTE[ch]) throw new LevelError(`column ${c}: unknown colour key '${ch}'`);
    cols.push(seq);
  }
  return cols;
}

/** "W18 W6 R5" → [{color:'W',count:18}, ...] (front → back). */
function parseLane(str) {
  const out = [];
  for (const tok of String(str).trim().split(/\s+/)) {
    if (!tok) continue;
    const m = /^([A-Z])([0-9]+)$/.exec(tok);
    if (!m) throw new LevelError(`bad cat token '${tok}'`);
    const count = parseInt(m[2], 10);
    if (!PALETTE[m[1]]) throw new LevelError(`unknown colour key '${m[1]}' in lane`);
    if (count <= 0) throw new LevelError(`cat '${tok}' carries no blocks`);
    out.push({ color: m[1], count });
  }
  return out;
}

function laneToString(lane) { return lane.map(c => c.color + c.count).join(' '); }

function colorCounts(cols) {
  const counts = {};
  for (const s of cols) for (const ch of s) counts[ch] = (counts[ch] || 0) + 1;
  return counts;
}

/**
 * Validate and normalise a level. Throws LevelError on any problem (plan §7 loader assertions).
 * opts.reverse reverses each column (yoink mode: the frontier is the topmost remaining block).
 */
function loadLevel(level, opts = {}) {
  if (!level || !Array.isArray(level.art)) throw new LevelError('level.art missing');
  let cols = columns(level.art);
  if (opts.reverse) cols = cols.map(s => s.slice().reverse());
  if (!Array.isArray(level.lanes) || level.lanes.length === 0) throw new LevelError('level.lanes missing');
  const lanes = level.lanes.map(l => (typeof l === 'string' ? parseLane(l) : l.map(c => ({ color: c.color, count: c.count }))));
  const need = colorCounts(cols), have = {};
  for (const lane of lanes) for (const c of lane) {
    if (typeof c.color !== 'string' || !PALETTE[c.color]) throw new LevelError(`unknown colour key '${c.color}' in lane`);
    if (!Number.isInteger(c.count) || c.count <= 0) throw new LevelError(`cat ${c.color}${c.count} carries no blocks`);
    have[c.color] = (have[c.color] || 0) + c.count;
  }
  for (const k of ['tray', 'shelf']) if (level[k] !== undefined && !(Number.isInteger(level[k]) && level[k] > 0)) throw new LevelError(`${k} must be a positive integer`);
  if (cols.every(s => s.length === 0)) throw new LevelError('board has no blocks');
  for (const k of new Set([...Object.keys(need), ...Object.keys(have)])) {
    if ((need[k] || 0) !== (have[k] || 0)) throw new LevelError(`colour ${k}: cells=${need[k] || 0} but cats carry ${have[k] || 0}`);
  }
  const H = level.art.length, W = level.art[0].length;
  return { id: level.id || 'level', name: level.name || 'Level', art: level.art.slice(), W, H, cols, lanes,
           trayCapacity: level.tray ?? CONFIG.trayCapacity, shelfCapacity: level.shelf ?? CONFIG.shelfCapacity,
           reverse: !!opts.reverse, colorCounts: need, seed: level.seed, preset: level.preset, achieved: level.achieved, greedyWins: level.greedyWins };
}

/** Loader assertions for the baked set (called at boot; fails loudly). */
function validateBakedLevels() {
  const ids = new Set();
  for (const lv of LEVELS) {
    if (ids.has(lv.id)) throw new LevelError(`duplicate level id ${lv.id}`);
    ids.add(lv.id);
    loadLevel(lv);
  }
  return true;
}

// ============================= GENERATOR ============================
// Port of plan Appendix A. Works on `cols` (bottom→top colour lists) and lanes as
// arrays of [color, count] pairs. Pure: every random draw comes from the rng passed in.
const GEN = (() => {
  /** how many columns want this colour next */
  function frontier(cols, ptr, color) {
    let n = 0;
    for (let c = 0; c < cols.length; c++) { const s = cols[c]; if (ptr[c] < s.length && s[ptr[c]] === color) n++; }
    return n;
  }

  /** Rule A: one block per column per pass (burstDrop is the rejected experimental variant). */
  function runPass(cols, ptr, color, count, burst) {
    let placed = 0;
    for (let c = 0; c < cols.length; c++) {
      const s = cols[c];
      if (count > 0 && ptr[c] < s.length && s[ptr[c]] === color) {
        ptr[c]++; count--; placed++;
        if (burst) while (count > 0 && ptr[c] < s.length && s[ptr[c]] === color) { ptr[c]++; count--; placed++; }
      }
    }
    return placed;
  }

  function allDone(cols, ptr) { for (let c = 0; c < cols.length; c++) if (ptr[c] < cols[c].length) return false; return true; }

  const PRESETS = {
    tutorial: { lanes:2, refTrayMax:1, pBig:0.45, bigMult:[1.5, 2.2], target:0.97 },
    easy:     { lanes:3, refTrayMax:2, pBig:0.45, bigMult:[1.5, 2.5], target:0.70 },
    medium:   { lanes:3, refTrayMax:3, pBig:0.65, bigMult:[2.0, 3.5], target:0.30 },
    hard:     { lanes:4, refTrayMax:4, pBig:0.85, bigMult:[2.5, 4.5], target:0.05, targetIsCeiling:true },
  };

  /**
   * Build the cat supply by playing a reference solution forward under the real rules.
   * Returns { cols, lanes:[[color,count]...][], maxTray, ref, where }.
   */
  function generate(cols, rng, o = {}) {
    const lanes = o.lanes ?? 3, trayCap = o.trayCap ?? 5, refTrayMax = o.refTrayMax ?? 3, pBig = o.pBig ?? 0.5,
          bigMult = o.bigMult ?? [2.0, 3.5], maxCount = o.maxCount ?? 20, pRecall = o.pRecall ?? 0.75;
    const ptr = new Array(cols.length).fill(0);
    const un = {}, order = [];                        // blocks per colour not yet given to a cat (insertion order kept)
    for (const s of cols) for (const ch of s) { if (!(ch in un)) { un[ch] = 0; order.push(ch); } un[ch]++; }
    const tray = [], cats = [], ref = [];             // tray items: [colour, left, catIndex]
    let last = null, maxTray = 0;
    let guard = 0;
    while (!allDone(cols, ptr)) {
      if (++guard > 100000) throw new Error('generator did not converge');
      const recall = tray.filter(t => frontier(cols, ptr, t[0]) > 0);
      const fresh = order.filter(x => un[x] > 0 && frontier(cols, ptr, x) > 0);
      if (recall.length && (!fresh.length || rng.random() < pRecall)) {   // reference player re-sends a boxed cat
        const t = rng.choice(recall);
        t[1] -= runPass(cols, ptr, t[0], t[1]);
        ref.push(t[2]);
        if (t[1] === 0) tray.splice(tray.indexOf(t), 1);
        last = t[0]; continue;
      }
      if (fresh.length > 1 && fresh.includes(last) && rng.random() < 0.8) fresh.splice(fresh.indexOf(last), 1); // colour variety
      const x = rng.choice(fresh), can = frontier(cols, ptr, x);
      let n;
      if (tray.length < refTrayMax && un[x] > can && rng.random() < pBig) {
        n = Math.min(un[x], maxCount, Math.max(can + 1, Math.trunc(can * rng.uniform(bigMult[0], bigMult[1]))));  // BIG: will need a box
      } else {
        n = Math.min(can, un[x], maxCount);                                                                       // CLEAN: empties in one pass
      }
      un[x] -= n; cats.push([x, n]); const k = cats.length - 1; ref.push(k);
      const left = n - runPass(cols, ptr, x, n);
      if (left) tray.push([x, left, k]);
      maxTray = Math.max(maxTray, tray.length); last = x;
    }
    if (tray.length || Object.values(un).some(v => v > 0)) throw new Error('generator invariant broken');
    const L = []; for (let i = 0; i < lanes; i++) L.push([]);
    const where = {};
    for (let k = 0; k < cats.length; k++) {           // deal into lanes, biased to the shortest; order kept per lane
      const w = L.map(l => 1.0 / Math.pow(1 + l.length, 2));
      const i = rng.weightedIndex(w); where[k] = [i, L[i].length]; L[i].push(cats[k]);
    }
    return { cols, lanes: L, maxTray, ref, where, trayCap };
  }

  /** Proof of solvability: replays the reference line under the evaluator's rules. Must return true. */
  function replay(cols, L, ref, where, cap = 5) {
    const ptr = new Array(cols.length).fill(0), pos = new Array(L.length).fill(0), tray = new Map();
    for (const k of ref) {
      let x, n;
      if (tray.has(k)) { [x, n] = tray.get(k); tray.delete(k); }
      else {
        const [i, j] = where[k];
        if (pos[i] !== j) throw new Error('reference cat is not at the front of its lane');
        [x, n] = L[i][j]; pos[i]++;
      }
      const left = n - runPass(cols, ptr, x, n);
      if (left) { if (tray.size >= cap) return false; tray.set(k, [x, left]); }
    }
    return allDone(cols, ptr) && tray.size === 0;
  }

  // ---- turn-based evaluator (one pass fully resolves before the next move) ----
  function moves(cols, ptr, pos, L, tray) {
    const out = [];
    for (let i = 0; i < pos.length; i++) if (pos[i] < L[i].length) out.push(['lane', i]);
    for (let j = 0; j < tray.length; j++) if (frontier(cols, ptr, tray[j][0]) > 0) out.push(['tray', j]);
    return out;
  }

  function apply(cols, ptr, pos, L, tray, m, cap) {
    let x, n;
    if (m[0] === 'lane') { [x, n] = L[m[1]][pos[m[1]]]; pos[m[1]]++; }
    else { [x, n] = tray.splice(m[1], 1)[0]; }
    const left = n - runPass(cols, ptr, x, n);
    if (left) {
      if (tray.length >= cap) return false;           // came home, no free box -> loss

  /** greedy=false: uniform random legal moves. greedy=true: one-step lookahead "attentive casual player". */
  function playout(cols, L, cap, rng, greedy) {
    const ptr = new Array(cols.length).fill(0), pos = new Array(L.length).fill(0), tray = [];
    let guard = 0;
    while (!allDone(cols, ptr)) {
      if (++guard > 10000) return false;
      const mv = moves(cols, ptr, pos, L, tray);
      if (!mv.length) return false;
      let m;
      if (greedy) {
        let best = null, bestScore = null;
        for (const cand of mv) {
          const [x, n] = cand[0] === 'lane' ? L[cand[1]][pos[cand[1]]] : tray[cand[1]];
          const can = Math.min(n, frontier(cols, ptr, x));
          const fatal = cand[0] === 'lane' && can < n && tray.length >= cap;
          const score = [fatal ? 0 : 1, can === n ? 1 : 0, can + (cand[0] === 'tray' ? 0.5 : 0)];

  function cmpTuple(a, b) { for (let i = 0; i < a.length; i++) { if (a[i] > b[i]) return 1; if (a[i] < b[i]) return -1; } return 0; }

  function randomWinRate(cols, L, cap, rng, n = 100) {

    return w / n;
  }

   * Returns { solvable, nodes, line } where line is the winning move list (or null).
   */
  function solve(cols, L, cap = 5, maxNodes = 5e6) {
    const ptr = new Array(cols.length).fill(0), pos = new Array(L.length).fill(0);
    const seen = new Set(); let nodes = 0; let aborted = false;
    const line = [];
    function key(tray) { return ptr.join(',') + '|' + pos.join(',') + '|' + tray.map(t => `${t[0]}${t[1]}`).sort().join(','); }

      const k = key(tray);
      if (seen.has(k)) return false;
      if (++nodes > maxNodes) { aborted = true; return false; }
      seen.add(k);

        if (ok) { line.push(m); if (dfs(tray)) return true; line.pop(); }

        for (let i = 0; i < pos.length; i++) pos[i] = pos0[i];

      reverse, target: p.target, targetIsCeiling: !!p.targetIsCeiling, candidateIndex: best.index,

// ================================ SIM ===============================
/**
 * createSim(level, opts) — the whole game as a deterministic, turn-based puzzle (plan §6.3).
 * opts.mode: 'build' | 'yoink'. When absent, a level generated with reverse:true is yoink, anything else build.
 * In yoink mode `cols[c]` is the placement SEQUENCE (top→bottom); placements carry both `idx` (sequence index)
 * and `row` (visual row from the bottom), and renderers must use `row` / `rowOf` / `frontierRow`.

  sim.rowOf = rowOf;

    if (sim.inFlight.length >= sim.shelfCapacity) { sim.stats.deniedTaps++; return { ok: false, reason: 'shelf_full' }; }
    const n = sim.canPlaceNow(c);
    if (c.where === 'box' && n === 0) { sim.stats.deniedTaps++; return { ok: false, reason: 'nothing_to_place' }; }

        ptr[col]++; c.count--;

        }

    sim.stats.dispatches++; sim.stats.placedBlocks += placements.length;
    if (placements.length === 0) sim.stats.zeroPlaceDispatches++;

  };

  /** presentation calls this at the slide's end */
  sim.arrive = (id) => {
    const c = cat(id);
    if (!c || c.where !== 'flight') return { to: 'noop' };
    if (c.count === 0) { sim.inFlight.splice(sim.inFlight.indexOf(c), 1); c.where = 'gone'; return { to: 'exit' }; }

    }

  };

  /** call after any box frees → [{ catId, slot }] (each one is a grace save) */
  sim.assignWaiting = (isContinue = false) => {
    const out = [];
    for (const c of sim.inFlight.slice()) {

      const slot = firstFreeBox(); if (slot < 0) break;
      sim.inFlight.splice(sim.inFlight.indexOf(c), 1);
      c.where = 'box'; c.slot = slot; sim.boxes[slot] = c; noteBoxes();
      if (!isContinue) sim.stats.graceSaves++;
      out.push({ catId: c.id, slot });
    }
    return out;
  };

  sim.graceExpired = (id) => {
    const c = cat(id);
    if (!c || c.where !== 'wait' || sim.status !== 'playing') return false;
    sim.status = 'failed'; sim.failReason = 'no_box';
    return true;
  };

  /** the "+1 box" continue: adds a box, seats waiting cats, resumes play */
  sim.addBox = () => {
    sim.boxes.push(null);
    sim.stats.continuesUsed++;
    if (sim.status === 'failed') { sim.status = 'playing'; sim.failReason = null; }
    const seated = sim.assignWaiting(true);
    noteBoxes();
    return { boxes: sim.boxes.length, seated };
  };

  /** plan §4.7 — the caller applies the 0.8 s beat */
  sim.isStuck = () => {
    if (sim.status !== 'playing') return false;
    if (sim.inFlight.length > 0) return false;
    for (const c of cats) if (sim.isTappable(c) && sim.canPlaceNow(c) > 0) return false;
    const trayFull = sim.boxes.every(b => b !== null);
    const lanesEmpty = lanes.every(l => l.length === 0);
    return trayFull || lanesEmpty;
  };

  sim.failStuck = () => {
    if (sim.status !== 'playing') return false;
    sim.status = 'failed'; sim.failReason = 'stuck'; return true;
  };

  /** test plan §13.1.4: for each colour, unplaced cells == sum of remaining counts over all cats of that colour */
  sim.checkInvariant = () => {
    const unplaced = {}, carried = {};
    for (let c = 0; c < W; c++) for (let i = ptr[c]; i < cols[c].length; i++) unplaced[cols[c][i]] = (unplaced[cols[c][i]] || 0) + 1;
    for (const c of cats) if (c.count > 0) carried[c.color] = (carried[c.color] || 0) + c.count;
    for (const k of new Set([...Object.keys(unplaced), ...Object.keys(carried)])) {
      if ((unplaced[k] || 0) !== (carried[k] || 0)) return { ok: false, color: k, unplaced: unplaced[k] || 0, carried: carried[k] || 0 };
    }
    return { ok: true };
  };

  sim.snapshot = () => ({
    status: sim.status, failReason: sim.failReason, ptr: ptr.slice(),
    lanes: lanes.map(l => l.map(c => c.id)), boxes: sim.boxes.map(b => (b ? b.id : null)),
    inFlight: sim.inFlight.map(c => c.id), cats: cats.map(c => ({ id: c.id, color: c.color, count: c.count, where: c.where })),
  });

  return sim;
}

const CORE = { CONFIG, mulberry32, makeRng, hashSeed, PALETTE, SYMBOLS, LEVELS, BACKTEST, LevelError, columns, parseLane, laneToString,

// ------------------------------ RENDER: sprites (plan §8.3) ------------------------------

// ---------- particles / floating text ----------
function addParticle(kind, x, y, vx, vy, ttl, color, size) {

// ---------- fixed-step update ----------
function update(dt) {
  const G = Game, sim = G.sim; if (!sim) return;
  const L = G.L;
  G.time += dt; G.stateT += dt;
  if (G.state === 'playing') G.playTime += dt;
  G.shelfFlash = Math.max(0, G.shelfFlash - dt * 5);
  for (let c = 0; c < L.W; c++) G.colNudge[c] = Math.max(0, G.colNudge[c] - dt / 0.14);

  for (const a of G.actors) {

    // shared timers

    if (a.badgePop > 0) a.badgePop = Math.max(0, a.badgePop - dt / 0.22);
    if (a.swipe >= 0) { a.swipe += dt / 0.09; if (a.swipe > 1) a.swipe = -1; }
    if (a.shake > 0) a.shake = Math.max(0, a.shake - dt / 0.18);
    if (a.wiggle > 0) a.wiggle = Math.max(0, a.wiggle - dt / 0.3);
    if (a.happy > 0) a.happy = Math.max(0, a.happy - dt / 0.5);

    if (a.blink > 0) a.blink = Math.max(0, a.blink - dt / 0.12);
    a.nextTwitch -= dt; if (a.nextTwitch <= 0) { a.earTwitch = 1; a.nextTwitch = rand(3, 9); }
    if (a.earTwitch > 0) a.earTwitch = Math.max(0, a.earTwitch - dt / 0.25);
    const canPlace = (a.state === 'lane' || a.state === 'box') && sim.isTappable(a.cat) ? sim.canPlaceNow(a.cat) : 0;

      else { a.bounce = 0; a.look = front && settings.assist && canPlace === 0 ? { dx: 1.5, dy: 0.6 } : { dx: 0, dy: 0 }; }
      if (a.cheer > 0) a.bounce = Math.abs(Math.sin(G.time * 12)) * 10 * a.cheer;
    } else if (a.state === 'boxhop') {
      a.t += dt; const u = clamp(a.t / 0.25, 0, 1), e = easeInOut(u);
      a.x = lerp(a.from.x, a.to.x, e); a.y = lerp(a.from.y, a.to.y, e) - Math.sin(u * Math.PI) * 50; a.s = lerp(a.from.s, 1, u); a.tilt = 0;

    g.appendChild(el('div', 'meta', 'any art · any preset · seeded'));
    g.addEventListener('click', () => { Audio.init(); showGen(); });
    tiles.appendChild(g);
  }
  function showSelect() {
    Game.sim = null; Game.state = 'idle';
    closeModal(); clearTips(); buildTiles();
    select.classList.remove('hidden'); hud.classList.add('hidden');
  }
  function play(index) { Game.levelIndex = index; startLevel(LEVELS[index]); }
  function playGenerated(level, mode) { Game.levelIndex = -1; Game.genSpec = { art: level.art, preset: level.preset, seed: level.seed, artId: level.artId }; startLevel(level, { mode }); }
  function restart() {
    if (!Game.def) return;
    if (Game.def.id.startsWith('gen-')) startLevel(Game.def, { mode: Game.mode }); else startLevel(Game.def);
  }
  function onLevelStart() {
    const G = Game; select.classList.add('hidden'); closeModal(); clearTips(); hud.classList.remove('hidden');
    const idx = G.levelIndex;
    title.textContent = idx >= 0 ? `Level ${idx + 1} · ${G.def.name}` : `${G.def.preset || 'generated'} · ${G.mode === 'yoink' ? 'yoink' : 'build'} · seed ${G.def.seed}`;
    // tutorial (plan §11.2)
    if (idx === 0) { tutorialStep(1); }
    else if (idx === 1 && !settings.seenTips.frontOnly) { settings.seenTips.frontOnly = true; saveSettings(); showTip('Only the front cat in each line can go.', DW / 2, 640, 5); }
    updateDebug(true);
  }
  // ---- tutorial tips ----
  function clearTips() { tips.innerHTML = ''; for (const t of tipTimers) clearTimeout(t); tipTimers = []; }
  function showTip(text, x, y, secs, cls) {
    const d = el('div', 'tip' + (cls ? ' ' + cls : ''), text); tips.appendChild(d);
    d.style.left = '0px'; d.style.top = '0px';
    requestAnimationFrame(() => { const r = d.getBoundingClientRect(); const w = r.width / view.scale, h = r.height / view.scale; d.style.left = clamp(x - w / 2, 8, DW - w - 8) + 'px'; d.style.top = (y - h / 2) + 'px'; });
    if (secs) tipTimers.push(setTimeout(() => { if (d.parentNode) d.remove(); }, secs * 1000));
    return d;
  }
  let tutState = 0;
  function tutorialStep(n) {
    const G = Game, L = G.L; tutState = n; clearTips();
    if (n === 1) {
      const lx = L.laneX(0);
      showTip('👆', lx + 30, L.laneRows[0].y - 46, 0, 'hand');
      showTip('Tap a cat.', lx + 10, L.laneRows[0].y - 92, 0);
    }
  }
  function tutorialEvent(kind) {
    const G = Game; if (G.levelIndex !== 0) return;
    if (kind === 'dispatch' && tutState === 1) { clearTips(); tutState = 1.5; }
    else if (kind === 'boxed' && !G.tut.tip2) { G.tut.tip2 = true; clearTips(); showTip('Cats with blocks left nap in a box. Run out of boxes and it’s over.', DW / 2, 640, 5); }
    else if (kind === 'frontier' && !G.tut.tip3) { G.tut.tip3 = true; if (!G.tut.tip2) return; clearTips(); showTip('Glowing squares show what each column needs next.', DW / 2, 130, 5); }
  }
  // ---- modal ----
  function openModal(node) { panel.innerHTML = ''; panel.appendChild(node); modal.classList.remove('hidden'); }
  function closeModal() { modal.classList.add('hidden'); }
  function modalOpen() { return !modal.classList.contains('hidden'); }
  function button(label, cls, fn) { const b = el('button', 'btn' + (cls ? ' ' + cls : ''), label); b.type = 'button'; b.addEventListener('click', fn); return b; }
  function showCard(result, reason, rec) {
    const G = Game, box = el('div');
    if (result === 'won') {
      box.appendChild(el('h2', null, `${G.def.name} done!`));
      const th = artThumb(G.def.art, true, 160, 150); th.className = 'card-pic'; box.appendChild(th);
      box.appendChild(el('p', null, `Time ${fmtTime(rec.timeSec)} · ${rec.dispatches} dispatches · ${rec.maxBoxesUsed} boxes at most`));
      if (rec.graceSaves) box.appendChild(el('p', 'small', `${rec.graceSaves} last-second save${rec.graceSaves > 1 ? 's' : ''}!`));
      const row = el('div', 'row');
      const hasNext = G.levelIndex >= 0 && G.levelIndex + 1 < LEVELS.length;
      row.appendChild(button(hasNext ? 'Next' : 'Levels', 'good', () => (hasNext ? play(G.levelIndex + 1) : showSelect())));
      row.appendChild(button('Replay', 'secondary', restart));
      if (hasNext) row.appendChild(button('Levels', 'secondary', showSelect));
      box.appendChild(row);
    } else {
      box.appendChild(el('h2', null, 'Out of room'));
      const waiter = G.actors.find(a => a.state === 'wait');
      const msg = reason === 'no_box'
        ? `No box was free for the ${waiter ? PALETTE[waiter.color].name : ''} cat, and nobody made room in time.`
        : 'The tray is full and no cat you can tap has a block to place.';
      box.appendChild(el('p', null, msg));
      box.appendChild(el('p', 'small', `${rec.dispatches} dispatches · ${Math.round((G.sim.placedCount() / G.sim.totalCells()) * 100)}% of the picture`));
      const row = el('div', 'row');
      if (!G.continueUsed) row.appendChild(button('+1 box and continue', 'good', () => { closeModal(); useContinue(); }));
      row.appendChild(button('Try again', G.continueUsed ? 'good' : 'secondary', restart));
      row.appendChild(button('Levels', 'secondary', showSelect));
      box.appendChild(row);
    }
    openModal(box);
  }
  function toggleRow(label, control) { const r = el('div', 'toggle'); r.appendChild(el('span', null, label)); r.appendChild(control); return r; }
  function checkbox(val, fn) { const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!val; c.addEventListener('change', () => fn(c.checked)); return c; }
  function showSettings() {
    const box = el('div'); box.appendChild(el('h2', null, 'Settings'));
    box.appendChild(toggleRow('Sound', checkbox(settings.sound, v => { settings.sound = v; saveSettings(); if (v) Audio.init(); })));
    box.appendChild(toggleRow('Symbols (colour-blind)', checkbox(settings.symbols, v => { settings.symbols = v; saveSettings(); })));
    box.appendChild(toggleRow('Assist (ready cats bounce)', checkbox(settings.assist, v => { settings.assist = v; saveSettings(); })));
    const sel = document.createElement('select');
    for (const [v, n] of [['auto', 'System'], ['on', 'Reduced'], ['off', 'Full']]) { const o = document.createElement('option'); o.value = v; o.textContent = n; if (settings.motion === v) o.selected = true; sel.appendChild(o); }
    sel.addEventListener('change', () => { settings.motion = sel.value; saveSettings(); });
    box.appendChild(toggleRow('Motion', sel));
    const row = el('div', 'row');
    row.appendChild(button('🐞 Debug', 'secondary', () => { closeModal(); toggleDebug(true); }));
    row.appendChild(button('Reset progress', 'secondary', () => { progress.done = {}; settings.seenTips = {}; Store.clear(); saveSettings(); saveProgress(); Game.telemetry = []; closeModal(); if (!Game.sim) buildTiles(); }));
    row.appendChild(button('Done', null, closeModal));
    box.appendChild(row);
    if (!Store.available) box.appendChild(el('p', 'small', 'Storage is blocked here: settings and progress last for this visit only.'));
    openModal(box);
  }
  function showGen(spec) {
    spec = spec || Game.genSpec || { artId: 'chick', preset: 'easy', seed: (Math.random() * 1e9) >>> 0 };
    const box = el('div'); box.appendChild(el('h2', null, '🎲 Generated level'));
    const artSel = document.createElement('select');
    for (const lv of LEVELS) { const o = document.createElement('option'); o.value = lv.id; o.textContent = `${lv.name} (${Object.keys(colorCounts(columns(lv.art))).length} colours)`; if (lv.id === spec.artId) o.selected = true; artSel.appendChild(o); }
    const preSel = document.createElement('select');
    for (const p of Object.keys(GEN.PRESETS)) { const o = document.createElement('option'); o.value = p; o.textContent = p; if (p === spec.preset) o.selected = true; preSel.appendChild(o); }
    const seedIn = document.createElement('input'); seedIn.type = 'number'; seedIn.value = String(spec.seed); seedIn.style.width = '110px';
    const modeSel = document.createElement('select');
    for (const m of ['build', 'yoink']) { const o = document.createElement('option'); o.value = m; o.textContent = m; if ((spec.mode || CONFIG.mode) === m) o.selected = true; modeSel.appendChild(o); }
    box.appendChild(toggleRow('Art', artSel)); box.appendChild(toggleRow('Preset', preSel)); box.appendChild(toggleRow('Seed', seedIn)); box.appendChild(toggleRow('Mode', modeSel));
    const info = el('p', 'small', 'Generates 80 candidates, rates each with 100 random playouts, keeps the one closest to the preset target.'); box.appendChild(info);
    const row = el('div', 'row');
    row.appendChild(button('Random seed', 'secondary', () => { seedIn.value = String((Math.random() * 1e9) >>> 0); }));
    row.appendChild(button('Generate & play', 'good', () => {
      info.textContent = 'Generating…';
      setTimeout(() => {
        const art = LEVELS.find(l => l.id === artSel.value).art, seed = (parseInt(seedIn.value, 10) || 1) >>> 0, mode = modeSel.value, preset = preSel.value;
        const t0 = performance.now();
        let level;
        try { level = GEN.generateLevel({ art, preset, seed, reverse: mode === 'yoink' }); } catch (e) { info.textContent = 'Generation failed: ' + e.message; return; }
        level.artId = artSel.value; level.name = `${LEVELS.find(l => l.id === artSel.value).name} · ${preset}`;
        level.genMs = Math.round(performance.now() - t0);
        CONFIG.mode = mode;
        info.textContent = `Achieved random-win ${Math.round(level.achieved * 100)}% (target ${preset === 'hard' ? '≤ 5%' : Math.round(GEN.PRESETS[preset].target * 100) + '%'}) · greedy ${level.greedyWins ? 'wins' : 'loses'} · ${level.genMs} ms`;
        setTimeout(() => playGenerated(level, mode), 700);
      }, 30);
    }));
    row.appendChild(button('Back', 'secondary', () => { closeModal(); }));
    box.appendChild(row);
    openModal(box);
  }
  // ---- debug overlay + telemetry (plan §11.4) ----
  let dbgLive = null, dbgTele = null, dbgArea = null, dbgMode = null;
  function slider(label, key, min, max, step, onChange) {
    const wrap = el('label'); const val = el('span', null, String(CONFIG[key]));
    wrap.appendChild(document.createTextNode(label + ' ')); wrap.appendChild(val);
    const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = CONFIG[key];
    r.addEventListener('input', () => { CONFIG[key] = parseFloat(r.value); val.textContent = r.value; if (onChange) onChange(CONFIG[key]); });
    wrap.appendChild(r); return wrap;
  }
  function buildDebug() {
    debug.innerHTML = '';
    dbgLive = el('div', 'live'); debug.appendChild(dbgLive);
    debug.appendChild(slider('walkSpeed', 'walkSpeed', 3, 7, 0.1));
    debug.appendChild(slider('minDispatchGap', 'minDispatchGap', 0.1, 0.6, 0.02));
    debug.appendChild(slider('graceSeconds', 'graceSeconds', 1, 5, 0.1));
    debug.appendChild(slider('shelfCapacity', 'shelfCapacity', 1, 8, 1, v => { if (Game.sim) Game.sim.shelfCapacity = v; }));
    debug.appendChild(slider('trayCapacity (on restart)', 'trayCapacity', 3, 8, 1));
    const modeRow = el('div'); modeRow.appendChild(document.createTextNode('mode '));
    dbgMode = document.createElement('select');
    for (const m of ['build', 'yoink']) { const o = document.createElement('option'); o.value = m; o.textContent = m; dbgMode.appendChild(o); }
    dbgMode.addEventListener('change', () => {
      const G = Game; CONFIG.mode = dbgMode.value;
      if (G.def && G.def.id.startsWith('gen-')) {
        const lv = GEN.generateLevel({ art: G.def.art, preset: G.def.preset, seed: G.def.seed, reverse: dbgMode.value === 'yoink' });
        lv.artId = G.def.artId; lv.name = G.def.name; playGenerated(lv, dbgMode.value);
      }
    });
    modeRow.appendChild(dbgMode); modeRow.appendChild(el('span', 'small', ' (generated levels only)')); debug.appendChild(modeRow);
    const row = el('div');
    row.appendChild(button('Restart', 'secondary', restart));
    row.appendChild(button('Regenerate', 'secondary', () => showGen(Game.genSpec)));
    row.appendChild(button('Self-test', 'secondary', () => { const r = window.__selftest(); dbgArea.classList.remove('hidden'); dbgArea.value = r; }));
    debug.appendChild(row);
    dbgTele = el('div', 'tele'); debug.appendChild(dbgTele);
    const row2 = el('div');
    row2.appendChild(button('Copy stats', 'secondary', () => {
      const json = JSON.stringify(Game.telemetry, null, 2);
      const fallback = () => { dbgArea.classList.remove('hidden'); dbgArea.value = json; dbgArea.focus(); dbgArea.select(); };
      try { navigator.clipboard.writeText(json).then(() => { dbgTele.textContent = `copied ${Game.telemetry.length} record(s)`; }, fallback); } catch (e) { fallback(); }
    }));
    row2.appendChild(button('Close', 'secondary', () => toggleDebug(false)));
    debug.appendChild(row2);
    dbgArea = document.createElement('textarea'); dbgArea.className = 'hidden'; dbgArea.readOnly = true; debug.appendChild(dbgArea);
  }
  function toggleDebug(force) {
    debugOpen = force == null ? !debugOpen : !!force;
    if (debugOpen && !dbgLive) buildDebug();
    debug.classList.toggle('hidden', !debugOpen);
    updateDebug(true);
  }
  let dbgAcc = 0;
  function updateDebug(force) {
    if (!debugOpen || !dbgLive) return;
    dbgAcc += 1; if (!force && dbgAcc % 6) return;
    const G = Game, sim = G.sim;
    if (sim) {
      let landed = 0; for (const col of G.present) for (const v of col) if (v) landed++;
      if (G.mode === 'yoink') landed = sim.totalCells() - landed;
      dbgLive.textContent = `fps ${G.fps.toFixed(0)} · flight ${sim.inFlight.length}/${sim.shelfCapacity} · boxes ${sim.boxesUsed()}/${sim.boxes.length} · logical ${sim.placedCount()} / landed ${landed} of ${sim.totalCells()} · seed ${G.def.seed ?? '-'} · ${G.mode} · ${G.state}`;
    } else dbgLive.textContent = `fps ${G.fps.toFixed(0)} · no level`;
    if (dbgMode) { dbgMode.value = CONFIG.mode; dbgMode.disabled = !(G.def && G.def.id.startsWith('gen-')); }
    if (dbgTele) dbgTele.textContent = `telemetry: ${G.telemetry.length} record(s)` + (G.telemetry.length ? ` · last: ${G.telemetry[G.telemetry.length - 1].result} ${G.telemetry[G.telemetry.length - 1].timeSec}s` : '');
  }
  $('#btn-restart').addEventListener('click', () => { Audio.init(); restart(); });
  $('#btn-settings').addEventListener('click', () => { Audio.init(); if (modalOpen()) closeModal(); else showSettings(); });
  $('#btn-settings2').addEventListener('click', () => { Audio.init(); showSettings(); });
  modal.addEventListener('pointerdown', (e) => { if (e.target === modal && Game.sim && Game.state === 'playing') closeModal(); });
  return { showSelect, play, playGenerated, restart, onLevelStart, showCard, showSettings, showGen, tutorialEvent, toggleDebug, updateDebug, closeModal, modalOpen, artThumb };
})();

// ------------------------------ BOOT ------------------------------
function resize() {
  const dpr = Math.min(CONFIG.dprCap, window.devicePixelRatio || 1);
  const w = window.innerWidth, h = window.innerHeight;
  const scale = Math.min(w / DW, h / DH);
  view.dpr = dpr; view.scale = scale; view.S = scale * dpr;
  view.cw = Math.round(w * dpr); view.ch = Math.round(h * dpr);
  view.canvas.width = view.cw; view.canvas.height = view.ch;
  view.canvas.style.width = w + 'px'; view.canvas.style.height = h + 'px';
  const sx = (w - DW * scale) / 2, sy = (h - DH * scale) / 2;
  view.ox = Math.round(sx * dpr); view.oy = Math.round(sy * dpr);
  const stage = $('#stage'); stage.style.transform = `translate(${sx}px, ${sy}px) scale(${scale})`;
  Sprites.clear();
}
function loop(now) {
  const G = Game;
  const dt = clamp((now - view.lastFrame) / 1000, 0, 0.1);   // clamp: no teleporting after a background tab
  view.lastFrame = now;
  // a dialog that blocks taps (settings) pauses play, otherwise the grace countdown could expire with no way to react
  const paused = !!G.sim && G.state === 'playing' && UI.modalOpen();
  view.acc = paused ? 0 : (view.acc || 0) + dt;
  let steps = 0;
  while (view.acc >= CONFIG.fixedStep && steps < 16) { update(CONFIG.fixedStep); view.acc -= CONFIG.fixedStep; steps++; }
  if (steps === 16) view.acc = 0;
  G.paused = paused;
  render();
  G.fps = G.fps * 0.95 + (dt > 0 ? 1 / dt : 60) * 0.05;
  UI.updateDebug(false);
  requestAnimationFrame(loop);
}
function selftest() {
  const lines = [];
  try {
    validateBakedLevels(); lines.push('loader: ok');
    for (const lv of LEVELS) {
      const { cols, lanes, cap } = GEN.lanesOf(lv);
      const s = GEN.solve(cols, lanes, cap, 2e6);
      const rate = GEN.randomWinRate(cols, lanes, cap, makeRng(hashSeed('st:' + lv.id)), 300);
      const greedy = GEN.playout(cols, lanes, cap, makeRng(1), true);
      lines.push(`${lv.id}: solvable=${s.solvable} random-win=${rate.toFixed(2)} (appendix ${BACKTEST[lv.id].randomWin}) greedy=${greedy}`);
    }
    const run = () => { const sim = createSim(LEVELS[1]); const out = []; for (let i = 0; i < 30 && sim.status === 'playing'; i++) { const c = sim.tappableCats().find(x => sim.canPlaceNow(x) > 0) || sim.tappableCats()[0]; if (!c) break; const r = sim.dispatch(c.id); if (r.ok) { out.push(r.placements.length); sim.arrive(c.id); } const inv = sim.checkInvariant(); if (!inv.ok) out.push('INVARIANT BROKEN'); } return out.join(','); };
    lines.push(`determinism: ${run() === run() ? 'ok' : 'MISMATCH'}`);
  } catch (e) { lines.push('ERROR ' + e.message); }
  return lines.join('\n');
}
function boot() {
  try { validateBakedLevels(); } catch (e) {
    document.body.innerHTML = `<pre style="padding:20px;color:#33284F;white-space:pre-wrap">Level data failed validation:\n${e.message}</pre>`; throw e;
  }
  view.canvas = $('#c'); view.ctx = view.canvas.getContext('2d');
  resize(); window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 50));
  setupInput();
  UI.showSelect();
  view.lastFrame = performance.now();
  requestAnimationFrame(loop);
  window.__selftest = selftest;
  window.SC = { Game, CONFIG, LEVELS, GEN, createSim, startLevel, UI, tap: enqueueTap, hitTest, settings, Audio, view, useContinue, telemetry: () => Game.telemetry };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
